version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bybl-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bybl_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bybl_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: bybl-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-bybl_db}
      PORT: ${PORT:-8080}
      ADMIN_PORT: ${ADMIN_PORT:-8081}
      JWT_SECRET: ${JWT_SECRET:-bybl-jwt-super-secret-key-development-2026}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/admin}
      ADMIN_TITLE: ${ADMIN_TITLE:-bybl Admin}
      ADMIN_DEFAULT_DISK: ${ADMIN_DEFAULT_DISK:-local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bybl.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      BIBLE_KEY: ${BIBLE_KEY:-}
      ESV_KEY: ${ESV_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-noreply@bybl.local}
      WASABI_REGION: ${WASABI_REGION:-}
      WASABI_ENDPOINT: ${WASABI_ENDPOINT:-}
      WASABI_ACCESS_KEY: ${WASABI_ACCESS_KEY:-}
      WASABI_SECRET_KEY: ${WASABI_SECRET_KEY:-}
      WASABI_BUCKET: ${WASABI_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "${ADMIN_PORT:-8081}:${ADMIN_PORT:-8081}"
    volumes:
      - ./uploads:/app/uploads

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
